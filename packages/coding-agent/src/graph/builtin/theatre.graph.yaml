graph:
  # Theatre — SatoPi Built-in Three-Phase Workflow Graph
  #
  # This is the built-in graph that runs when the user types "swarm" magic keyword
  # or invokes `stp swarm run`.  It mirrors the existing SwarmRunner lifecycle:
  #   Script → Debate → Stage → Cross-Check → Curtain
  #
  # Users can extend this graph by copying it to .stp/graphs/ and adding nodes.

  name: theatre
  description: "SatoPi built-in five-phase workflow: Script → Debate → Stage → Cross-Check → Curtain"
  version: 1
  revision: 1
  strategy: waves
  builtin: true

  nodes:
    script:
      label: "Script · Planning"
      description: |
        Interactive planning phase. An agent converses with the user to
        understand requirements, researches the codebase, and produces a
        structured plan.md with phase-by-phase task breakdown.
      type: script
      role: planner
      tools:
        - read
        - grep
        - glob
        - write
        - edit
        - todo
        - ask
        - web_search
        - bash
      outputs:
        - id: plan
          description: "Structured execution plan with phases and tasks"
      gate:
        type: human-review
        mode: always
        prompt: "Plan is ready. Review the phases and confirm to launch Stage."
        options:
          - "Launch Stage"
          - "Revise Plan"
          - "Cancel"
      timeout: "0"

    debate:
      label: "Debate · Plan Refinement"
      description: |
        Multi-agent roundtable debate. Reviewer-style agents critique the
        draft plan produced by Script and converge on a refined version
        (Jaccard-similarity convergence with early exit) before execution.
        Disabled when magicKeywords.swarm.enableDebate is false — the plan
        then passes through unchanged.
      type: debate
      role: debater
      depends_on:
        - script
      tools:
        - read
        - grep
        - irc
      timeout: "15m"

    stage:
      label: "Stage · Execution"
      description: |
        Parallel execution phase. Parses plan.md into a DAG task queue,
        spawns worker agents with assigned roles, and executes tasks in
        waves. Agents can fork themselves for heavy workloads.
      type: stage
      role: stage-controller
      depends_on:
        - debate
      tools:
        - read
        - write
        - edit
        - grep
        - bash
        - task
        - irc
        - todo
        - agent_fork
      heavy: true
      gate:
        type: compile-check
        command: "bun check && bun test"
        mode: on-failure
      retry:
        max_attempts: 3
        strategy: exponential
        base_delay_ms: 5000
        on_failure: block
      timeout: "30m"
      max_context_tokens: 8000
      # Auto agent count: the loop runtime determines the optimal
      # number of worker agents from task complexity and plan size.
      # Equivalent to loopConfig.agents.auto = true

    cross_check:
      label: "Cross-Check · Review"
      description: |
        Post-Stage verification. Reviewer agents (swarm-reviewer profile)
        inspect every deliverable the Stage produced; deliverables that fail
        get a REWORK verdict, their task is blocked in the shared task queue,
        and the verdicts are recorded in the run state (reviewVerdict summary
        + activity log) so the next run retries them via the existing
        retry/backoff machinery.
      type: cross-check
      role: reviewer
      depends_on:
        - stage
      tools:
        - read
        - grep
        - bash
      timeout: "10m"

    curtain:
      label: "Curtain · Reflection"
      description: |
        Closing phase. Elects a reporter agent to summarize the delivery,
        runs reflection agents to extract lessons, and persists experience
        to the ExperienceStore. Optionally awaits human applaud.
      type: curtain
      role: reflector
      depends_on:
        - cross_check
      tools:
        - read
        - write
        - todo
        - bash
      gate:
        type: human-review
        mode: always
        prompt: "Delivery complete. Review the summary and applaud to finish."
        options:
          - "Applaud"
          - "Needs Revision"
      timeout: "5m"
      continue_on_failure: true
