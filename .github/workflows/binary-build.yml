name: Binary Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux-x64, rustTarget: "" }
          - { name: linux-arm64, rustTarget: "aarch64-unknown-linux-gnu.2.17" }
          - { name: darwin-x64, rustTarget: "x86_64-apple-darwin" }
          - { name: darwin-arm64, rustTarget: "aarch64-apple-darwin" }
          - { name: windows-x64, rustTarget: "x86_64-pc-windows-msvc" }

    env:
      CROSS_TARGET: ${{ matrix.target.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve Rust target triple
        id: rust
        run: |
          rust_target="${{ matrix.target.rustTarget }}"
          bare_target="${rust_target%%.*}"
          echo "rust_target=$rust_target" >> "$GITHUB_OUTPUT"
          echo "bare_target=$bare_target" >> "$GITHUB_OUTPUT"
          echo "Resolved rust_target='$rust_target' bare_target='$bare_target'"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-29
          targets: ${{ steps.rust.outputs.bare_target }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev build-essential

      - name: Setup zig (non-MSVC cross-compile)
        if: steps.rust.outputs.rust_target != '' && !endsWith(steps.rust.outputs.rust_target, '-msvc')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cargo-zigbuild (non-MSVC cross-compile)
        if: steps.rust.outputs.rust_target != '' && !endsWith(steps.rust.outputs.rust_target, '-msvc')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install cargo-xwin (MSVC cross-compile)
        if: endsWith(steps.rust.outputs.rust_target, '-msvc')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin

      - name: Install LLVM (MSVC cross-compile)
        if: endsWith(steps.rust.outputs.rust_target, '-msvc')
        run: sudo apt-get install -y clang lld llvm

      - name: Accept xwin license (MSVC cross-compile)
        if: endsWith(steps.rust.outputs.rust_target, '-msvc')
        run: echo "XWIN_ACCEPT_LICENSE=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install

      - name: Build binary
        working-directory: packages/coding-agent
        run: bun scripts/build-binary.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stp-${{ matrix.target.name }}
          path: packages/coding-agent/dist/stp*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: stp-*
          path: dist/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
