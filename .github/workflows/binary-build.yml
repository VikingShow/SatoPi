name: Binary Build

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: linux-x64 }
          - { name: linux-arm64 }
          - { name: darwin-x64 }
          - { name: darwin-arm64 }
          - { name: windows-x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Install dependencies
        run: bun install

      - name: Build binary (${{ matrix.target.name }})
        working-directory: packages/coding-agent
        env:
          CROSS_TARGET: ${{ matrix.target.name }}
        run: bun scripts/build-binary.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stp-${{ matrix.target.name }}
          path: packages/coding-agent/dist/stp*
          if-no-files-found: error
